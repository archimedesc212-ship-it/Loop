name: Hybrid deployment preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-and-deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Check deployment contracts
        run: npm run deploy:check

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test:web

      - name: Build frontend
        run: npm run build

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: muse_ci
      DB_APP_USER: muse_ci_app
      DB_APP_PASSWORD: ci-only-app-password
      DB_APP_HOST: "%"
      DB_OWNER_USER: root
      DB_OWNER_PASSWORD: ci-root-password
      DB_TIMEZONE: "+05:30"
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      JOBS_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate deterministic test fixtures
        run: npm run db:seed:generate

      - name: Build an isolated MySQL test database
        run: npm run db:setup -- --allow-destructive --no-intel

      - name: Run backend integration tests
        run: npm test

      - name: Verify SQL queries using the app account
        run: npm run test:sql

      - name: Verify migrations and empty-catalogue behaviour
        run: npm run db:verify
