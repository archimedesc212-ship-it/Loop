    const MOOD_CATEGORIES = [
      { id: "all", label: "All Moods", icon: "Sparkles", color: "from-green-500 to-emerald-700" },
      { id: "happy", label: "Happy & Upbeat", icon: "Smile", color: "from-amber-400 to-orange-600" },

    // --- MAIN REACT APPLICATION COMPONENT ---
    function LoopApp() {
      // Navigation & Layout State
      const [activeTab, setActiveTab] = useState("home");
      const [selectedLanguage, setSelectedLanguage] = useState("All");
      const [selectedMood, setSelectedMood] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [isExpandedPlayerOpen, setIsExpandedPlayerOpen] = useState(false);

      // Player Engine State
      const [catalogue] = useState(INITIAL_CATALOGUE);
      const [currentSong, setCurrentSong] = useState(INITIAL_CATALOGUE[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [playbackProgress, setPlaybackProgress] = useState(0); // 0 to 100
      const [currentTimeSec, setCurrentTimeSec] = useState(0);
      const [volume, setVolume] = useState(80);
      const [isMuted, setIsMuted] = useState(false);
      const [isShuffle, setIsShuffle] = useState(false);
      const [repeatMode, setRepeatMode] = useState("off"); // off, one, all
      const [playbackError, setPlaybackError] = useState(null);

      // User Persistence State
      const [favourites, setFavourites] = useState(() => {
        try {
          const saved = localStorage.getItem("loop_favourites");
          return saved ? JSON.parse(saved) : ["te-1", "hi-1"];
        } catch (e) {
          return ["te-1", "hi-1"];
        }
      });
      const [recentlyPlayed, setRecentlyPlayed] = useState([]);
      const [customPlaylists, setCustomPlaylists] = useState(() => {
        try {
          const saved = localStorage.getItem("loop_playlists");
          return saved ? JSON.parse(saved) : [
            { id: "p1", name: "My Favorites", songIds: ["te-1", "hi-1", "ta-1"] },
            { id: "p2", name: "Road Trip Vibes", songIds: ["en-2", "te-2"] }
          ];
        } catch (e) {
          return [{ id: "p1", name: "My Favorites", songIds: ["te-1", "hi-1"] }];
        }
      });

      const progressTimerRef = useRef(null);

      // Save Local Storage updates
      useEffect(() => {
        try {
          localStorage.setItem("loop_favourites", JSON.stringify(favourites));
        } catch (e) {}
      }, [favourites]);

      useEffect(() => {
        try {
          localStorage.setItem("loop_playlists", JSON.stringify(customPlaylists));
        } catch (e) {}
      }, [customPlaylists]);

      // Filtered Catalogue Logic with Guard
      const filteredSongs = useMemo(() => {
        if (!Array.isArray(catalogue)) return [];
        return catalogue.filter(song => {
          if (!song) return false;
          const matchesLang = selectedLanguage === "All" || song.language === selectedLanguage;
          const matchesMood = selectedMood === "all" || song.mood === selectedMood;
          const matchesSearch = searchQuery === "" || 
            song.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            song.artist.toLowerCase().includes(searchQuery.toLowerCase()) ||
            song.album.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesLang && matchesMood && matchesSearch;
        });
      }, [catalogue, selectedLanguage, selectedMood, searchQuery]);

      // Playback Controls Implementation
      const handlePlaySong = (song) => {
        if (!song || !song.playable) {
          setPlaybackError(`"${song?.title || 'Track'}" is metadata-only or restricted.`);
          setTimeout(() => setPlaybackError(null), 4000);
          return;
        }

        setCurrentSong(song);
        setIsPlaying(true);
        setPlaybackError(null);

        // Add to Recently Played
        setRecentlyPlayed(prev => {
          const filtered = prev.filter(s => s.id !== song.id);
          return [song, ...filtered].slice(0, 20);
        });
      };

      const togglePlayPause = () => {
        if (!currentSong) return;
        setIsPlaying(!isPlaying);
      };

      const handleNextSong = () => {
        if (filteredSongs.length === 0) return;
        let currentIndex = filteredSongs.findIndex(s => s.id === currentSong?.id);
        if (isShuffle) {
          currentIndex = Math.floor(Math.random() * filteredSongs.length);
        } else {
          currentIndex = (currentIndex + 1) % filteredSongs.length;
        }
        handlePlaySong(filteredSongs[currentIndex]);
      };

      const handlePrevSong = () => {
        if (filteredSongs.length === 0) return;
        let currentIndex = filteredSongs.findIndex(s => s.id === currentSong?.id);
        currentIndex = (currentIndex - 1 + filteredSongs.length) % filteredSongs.length;
        handlePlaySong(filteredSongs[currentIndex]);
      };

      const toggleFavourite = (songId) => {
        setFavourites(prev => 
          prev.includes(songId) ? prev.filter(id => id !== songId) : [...prev, songId]
        );
      };

      // Audio Timer Progress Engine
      useEffect(() => {
        if (isPlaying && currentSong) {
          progressTimerRef.current = setInterval(() => {
            setCurrentTimeSec(prev => {
              if (prev >= (currentSong.durationSec || 200)) {
                if (repeatMode === "one") {
                  return 0;
                } else {
                  handleNextSong();
                  return 0;
                }
              }
              const nextTime = prev + 1;
              setPlaybackProgress((nextTime / (currentSong.durationSec || 200)) * 100);
              return nextTime;
            });
          }, 1000);
        } else {
          clearInterval(progressTimerRef.current);
        }
        return () => clearInterval(progressTimerRef.current);
      }, [isPlaying, currentSong, repeatMode]);

      useEffect(() => {
        setCurrentTimeSec(0);
        setPlaybackProgress(0);
      }, [currentSong?.id]);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      const handleSeek = (e) => {
        const newProgress = parseFloat(e.target.value);
        setPlaybackProgress(newProgress);
        if (currentSong?.durationSec) {
          setCurrentTimeSec((newProgress / 100) * currentSong.durationSec);
        }
      };

      return (

                </div>

                <input

                  className="w-full bg-dark-card border border-dark-border rounded-full py-2 pl-10 pr-4 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-green-500 transition-colors"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery("")} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                    <Icon name="X" size={16} />

                )}
              </div>
            </div>

            {/* User Profile & Quick Options */}
            <div className="flex items-center space-x-4">
              <span className="hidden lg:inline-flex px-3 py-1 bg-green-500/10 text-green-400 rounded-full text-xs font-semibold border border-green-500/20">
                Demo Mode (Database-Free)

                <div className="w-9 h-9 rounded-full bg-gradient-to-r from-purple-500 to-indigo-600 flex items-center justify-center font-bold text-sm text-white shadow-md">
                  LP
                </div>
              </button>
            </div>
          </header>

          {/* Main Content Layout */}
          <div className="flex flex-1 overflow-hidden relative">
            {/* Sidebar Navigation */}
            <aside className={`

              ${isMobileMenuOpen ? "translate-x-0" : "-translate-x-full md:translate-x-0"}
            `}>
              <div className="space-y-6">
                <div>
                  <h4 className="text-xs font-semibold text-gray-500 uppercase tracking-wider px-3 mb-2">Discover</h4>
                  <nav className="space-y-1">
                    {[
                      { id: "home", label: "Home", icon: "Home" },
                      { id: "explore", label: "Explore & Genres", icon: "Compass" },
                      { id: "moods", label: "Mood Station", icon: "Smile" },
                      { id: "multilingual", label: "Languages", icon: "Globe" }
                    ].map(item => (
                      <button
                        key={item.id}
                        onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }}
                        className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all ${
                          activeTab === item.id 
                            ? "bg-green-500/10 text-green-400 font-semibold border-l-4 border-green-500" 
                            : "text-gray-400 hover:text-gray-200 hover:bg-dark-hover"
                        }`}
                      >
                        <Icon name={item.icon} size={18} />
                        <span>{item.label}</span>
                      </button>
                    ))}
                  </nav>
                </div>

                <div>
                  <h4 className="text-xs font-semibold text-gray-500 uppercase tracking-wider px-3 mb-2">My Library</h4>
                  <nav className="space-y-1">
                    {[
                      { id: "favourites", label: "Liked Songs", icon: "Heart" },
                      { id: "recent", label: "Recently Played", icon: "Clock" },
                      { id: "playlists", label: "Playlists", icon: "ListMusic" }
                    ].map(item => (
                      <button
                        key={item.id}
                        onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }}
                        className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all ${
                          activeTab === item.id 
                            ? "bg-green-500/10 text-green-400 font-semibold border-l-4 border-green-500" 
                            : "text-gray-400 hover:text-gray-200 hover:bg-dark-hover"
                        }`}
                      >
                        <Icon name={item.icon} size={18} />
                        <span>{item.label}</span>
                      </button>
                    ))}
                  </nav>
                </div>
              </div>

              {/* Sidebar Footer Info */}
              <div className="p-3 bg-dark-card/60 rounded-2xl border border-dark-border/40 text-xs text-gray-400 space-y-1">
                <div className="font-semibold text-gray-200">LOOP Music V9</div>
                <div>YouTube & Local Engine</div>
                <div className="text-[10px] text-green-400 mt-1 font-mono">Status: Ready for Production</div>
              </div>
            </aside>

            {/* Central View Area */}
            <main className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 pb-32">
              {/* Global Error Banner */}
              {playbackError && (
                <div className="mb-6 p-4 bg-red-500/15 border border-red-500/30 rounded-2xl flex items-center justify-between text-red-300 text-sm">
                  <div className="flex items-center space-x-3">
                    <Icon name="AlertCircle" size={20} className="text-red-400 flex-shrink-0" />
                    <span>{playbackError}</span>
                  </div>
                  <button 
                    onClick={() => setPlaybackError(null)}
                    className="text-gray-400 hover:text-white"
                  >
                    <Icon name="X" size={16} />
                  </button>
                </div>
              )}

              {/* Language Filters Header */}
              <div className="flex items-center space-x-2 overflow-x-auto pb-4 custom-scrollbar mb-6">
                {LANGUAGES.map(lang => (
                  <button
                    key={lang}
                    onClick={() => setSelectedLanguage(lang)}
                    className={`px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
                      selectedLanguage === lang 
                        ? "bg-white text-black shadow-md" 
                        : "bg-dark-card text-gray-300 hover:bg-dark-hover border border-dark-border"
                    }`}
                  >
                    {lang}
                  </button>
                ))}
              </div>

              {/* TAB 1: HOME VIEW */}
              {activeTab === "home" && (
                <div className="space-y-8">
                  {/* Hero Featured Banner */}
                  <div className="relative rounded-3xl overflow-hidden bg-gradient-to-r from-green-900/60 via-emerald-950 to-dark-card p-6 md:p-10 border border-green-500/20 shadow-2xl">
                    <div className="relative z-10 max-w-xl space-y-4">
                      <span className="inline-block px-3 py-1 bg-green-500/20 text-green-400 rounded-full text-xs font-extrabold uppercase tracking-widest">
                        Featured Album
                      </span>
                      <h1 className="text-3xl md:text-5xl font-extrabold text-white tracking-tight">
                        Ala Vaikunthapurramuloo
                      </h1>
                      <p className="text-gray-300 text-sm md:text-base leading-relaxed">
                        Experience sensational South-Indian beats by Thaman S, featuring hit tracks like Butta Bomma & Ramuloo Ramulaa.
                      </p>
                      <div className="flex items-center space-x-4 pt-2">
                        <button 
                          onClick={() => handlePlaySong(INITIAL_CATALOGUE[0])}
                          className="px-6 py-3 bg-green-500 hover:bg-green-400 text-black font-extrabold rounded-full flex items-center space-x-2 shadow-lg glow-effect transition-transform hover:scale-105"
                        >
                          <Icon name="Play" size={20} className="fill-black" />
                          <span>Play Now</span>
                        </button>
                        <button 
                          onClick={() => toggleFavourite("te-1")}
                          className="p-3 bg-white/10 hover:bg-white/20 text-white rounded-full transition-colors backdrop-blur-md"
                        >
                          <Icon name="Heart" size={20} className={favourites.includes("te-1") ? "fill-red-500 text-red-500" : ""} />
                        </button>
                      </div>
                    </div>
                    {/* Background Artwork Effect */}
                    <img 
                      src={INITIAL_CATALOGUE[0].coverUrl} 
                      alt="Banner" 
                      className="absolute right-0 top-0 h-full w-1/2 object-cover opacity-30 mix-blend-overlay hidden md:block"
                    />
                  </div>

                  {/* Songs Section */}
                  <div>
                    <div className="flex items-center justify-between mb-4">
                      <h2 className="text-xl font-bold text-white flex items-center space-x-2">
                        <Icon name="TrendingUp" className="text-green-500" />
                        <span>Trending & Popular Hits</span>
                      </h2>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                      {filteredSongs.map(song => (
                        <div 
                          key={song.id}
                          className="group bg-dark-card/60 hover:bg-dark-hover p-4 rounded-2xl border border-dark-border/40 transition-all duration-300 hover:shadow-xl hover:-translate-y-1 cursor-pointer"
                        >
                          <div className="relative aspect-square rounded-xl overflow-hidden mb-3">
                            <img src={song.coverUrl} alt={song.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                            <button 
                              onClick={() => handlePlaySong(song)}
                              className="absolute right-3 bottom-3 w-10 h-10 bg-green-500 rounded-full flex items-center justify-center text-black shadow-lg opacity-0 group-hover:opacity-100 transition-all duration-300 hover:scale-110"
                            >
                              <Icon name={currentSong?.id === song.id && isPlaying ? "Pause" : "Play"} size={20} className="fill-black ml-0.5" />
                            </button>
                          </div>
                          <h3 className="font-semibold text-sm text-white truncate">{song.title}</h3>
                          <p className="text-xs text-gray-400 truncate mt-0.5">{song.artist}</p>
                          <div className="flex items-center justify-between mt-2 pt-2 border-t border-dark-border/30 text-[10px] text-gray-500">
                            <span className="uppercase font-mono">{song.language}</span>
                            <span>{song.duration}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: MOOD STATION */}
              {activeTab === "moods" && (
                <div className="space-y-6">
                  <div>
                    <h1 className="text-2xl md:text-3xl font-extrabold text-white">Mood Station</h1>
                    <p className="text-gray-400 text-sm mt-1">Select your current vibe to get tailored music recommendations.</p>
                  </div>

                  {/* Mood Grid Selector */}
                  <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                    {MOOD_CATEGORIES.map(mood => (
                      <button
                        key={mood.id}
                        onClick={() => setSelectedMood(mood.id)}
                        className={`p-5 rounded-2xl flex flex-col justify-between text-left h-32 relative overflow-hidden transition-all ${
                          selectedMood === mood.id 
                            ? "ring-2 ring-green-500 shadow-xl scale-[1.02]" 
                            : "opacity-80 hover:opacity-100"
                        } bg-gradient-to-br ${mood.color}`}
                      >
                        <div className="flex items-center justify-between w-full z-10">
                          <span className="font-bold text-white text-lg">{mood.label}</span>
                          <Icon name={mood.icon} size={24} className="text-white/80" />
                        </div>
                        <span className="text-xs text-white/70 z-10 font-medium">Explore Playlist &rarr;</span>
                      </button>
                    ))}
                  </div>

                  {/* Recommendations Output */}
                  <div className="pt-4">
                    <h2 className="text-lg font-bold text-white mb-4">
                      {selectedMood === "all" ? "Recommended For You" : `Tracks for "${MOOD_CATEGORIES.find(m=>m.id===selectedMood)?.label}"`}
                    </h2>
                    <div className="space-y-2">
                      {filteredSongs.map(song => (
                        <div 
                          key={song.id}
                          onClick={() => handlePlaySong(song)}
                          className="flex items-center justify-between p-3 rounded-xl bg-dark-card hover:bg-dark-hover border border-dark-border/40 cursor-pointer group transition-colors"
                        >
                          <div className="flex items-center space-x-4">
                            <img src={song.coverUrl} alt={song.title} className="w-12 h-12 rounded-lg object-cover" />
                            <div>
                              <div className="font-semibold text-sm text-white group-hover:text-green-400 transition-colors">{song.title}</div>
                              <div className="text-xs text-gray-400">{song.artist} • {song.album}</div>
                            </div>
                          </div>
                          <div className="flex items-center space-x-4">
                            <span className="text-xs text-gray-500 font-mono hidden sm:inline">{song.duration}</span>
                            <button 
                              onClick={(e) => { e.stopPropagation(); toggleFavourite(song.id); }}
                              className="text-gray-400 hover:text-red-500"
                            >
                              <Icon name="Heart" size={18} className={favourites.includes(song.id) ? "fill-red-500 text-red-500" : ""} />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 3: MULTILINGUAL MUSIC */}
              {activeTab === "multilingual" && (
                <div className="space-y-6">
                  <div>
                    <h1 className="text-2xl md:text-3xl font-extrabold text-white">Multilingual Hub</h1>
                    <p className="text-gray-400 text-sm mt-1">Browse dedicated Telugu, Hindi, Tamil & International releases.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {["Telugu", "Hindi", "Tamil"].map(lang => (
                      <div key={lang} className="bg-dark-card border border-dark-border rounded-2xl p-5 space-y-4">
                        <div className="flex items-center justify-between border-b border-dark-border pb-3">
                          <h2 className="font-bold text-lg text-white">{lang} Top Charts</h2>
                          <span className="text-xs text-green-400 font-mono">Updated</span>
                        </div>
                        <div className="space-y-3">
                          {catalogue.filter(s => s.language === lang).map(song => (
                            <div key={song.id} className="flex items-center justify-between p-2 rounded-lg hover:bg-dark-hover cursor-pointer" onClick={() => handlePlaySong(song)}>
                              <div className="flex items-center space-x-3">
                                <img src={song.coverUrl} className="w-10 h-10 rounded-md object-cover" />
                                <div>
                                  <div className="text-xs font-semibold text-white">{song.title}</div>
                                  <div className="text-[10px] text-gray-400">{song.artist}</div>
                                </div>
                              </div>
                              <Icon name="Play" size={16} className="text-gray-400 hover:text-green-500" />
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 4: LIKED SONGS / FAVOURITES */}
              {activeTab === "favourites" && (
                <div className="space-y-6">
                  <div className="flex items-center space-x-4">
                    <div className="w-20 h-20 rounded-2xl bg-gradient-to-tr from-rose-500 to-pink-600 flex items-center justify-center shadow-lg">
                      <Icon name="Heart" size={40} className="fill-white text-white" />
                    </div>
                    <div>
                      <h1 className="text-3xl font-extrabold text-white">Liked Songs</h1>
                      <p className="text-gray-400 text-sm mt-1">{favourites.length} tracks saved in local library</p>
                    </div>
                  </div>

                  <div className="space-y-2 pt-4">
                    {catalogue.filter(s => favourites.includes(s.id)).map((song, idx) => (
                      <div 
                        key={song.id}
                        className="flex items-center justify-between p-3 rounded-xl bg-dark-card hover:bg-dark-hover border border-dark-border/40 cursor-pointer"
                        onClick={() => handlePlaySong(song)}
                      >
                        <div className="flex items-center space-x-4">
                          <span className="text-sm font-bold text-gray-500 w-6 text-center">{idx + 1}</span>
                          <img src={song.coverUrl} className="w-12 h-12 rounded-lg object-cover" />
                          <div>
                            <div className="font-semibold text-sm text-white">{song.title}</div>
                            <div className="text-xs text-gray-400">{song.artist}</div>
                          </div>
                        </div>
                        <button 
                          onClick={(e) => { e.stopPropagation(); toggleFavourite(song.id); }}
                          className="text-red-500 hover:text-gray-400 p-2"
                        >
                          <Icon name="Heart" size={18} className="fill-red-500" />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 5: PROFILE & DEMO MODE METRICS */}
              {activeTab === "profile" && (
                <div className="max-w-2xl space-y-6">
                  <div className="glass-panel p-6 rounded-3xl space-y-4">
                    <div className="flex items-center space-x-4">
                      <div className="w-16 h-16 rounded-full bg-gradient-to-r from-green-500 to-emerald-600 flex items-center justify-center text-black font-extrabold text-2xl">
                        LP
                      </div>
                      <div>
                        <h2 className="text-xl font-bold text-white">LOOP Production User</h2>
                        <p className="text-xs text-gray-400">Database-Free Local Session active</p>
                      </div>
                    </div>
                    
                    <div className="pt-4 border-t border-dark-border space-y-3">
                      <h3 className="text-sm font-bold text-white uppercase tracking-wider">System Capabilities</h3>
                      <div className="grid grid-cols-2 gap-4 text-xs">
                        <div className="p-3 bg-dark-card rounded-xl border border-dark-border">
                          <div className="text-gray-400">LocalStorage Songs</div>
                          <div className="text-lg font-bold text-green-400 mt-1">{favourites.length} Favourites</div>
                        </div>
                        <div className="p-3 bg-dark-card rounded-xl border border-dark-border">
                          <div className="text-gray-400">YouTube Audio Service</div>
                          <div className="text-lg font-bold text-green-400 mt-1">Embed Ready</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* PERSISTENT NOW PLAYING BAR (MINI PLAYER) */}
          {currentSong && (
            <footer className="fixed bottom-0 left-0 right-0 h-24 glass-panel border-t border-dark-border/80 px-4 md:px-8 z-40 flex items-center justify-between">
              {/* Left Track Info */}
              <div className="flex items-center space-x-4 w-1/4">
                <div 
                  className="relative group cursor-pointer"
                  onClick={() => setIsExpandedPlayerOpen(true)}
                >
                  <img src={currentSong.coverUrl} alt={currentSong.title} className="w-14 h-14 rounded-xl object-cover shadow-md" />
                  <div className="absolute inset-0 bg-black/40 rounded-xl opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                    <Icon name="Maximize2" size={16} className="text-white" />
                  </div>
                </div>
                <div className="hidden sm:block overflow-hidden">
                  <h4 className="text-sm font-semibold text-white truncate cursor-pointer hover:underline" onClick={() => setIsExpandedPlayerOpen(true)}>
                    {currentSong.title}
                  </h4>
                  <p className="text-xs text-gray-400 truncate">{currentSong.artist}</p>
                </div>
                <button onClick={() => toggleFavourite(currentSong.id)} className="text-gray-400 hover:text-red-500">
                  <Icon name="Heart" size={18} className={favourites.includes(currentSong.id) ? "fill-red-500 text-red-500" : ""} />
                </button>
              </div>

              {/* Center Controls & Progress Bar */}
              <div className="flex flex-col items-center justify-center w-2/4 max-w-xl">
                <div className="flex items-center space-x-6 mb-2">
                  <button 
                    onClick={() => setIsShuffle(!isShuffle)} 
                    className={`text-xs ${isShuffle ? "text-green-500" : "text-gray-400 hover:text-white"}`}
                  >
                    <Icon name="Shuffle" size={18} />
                  </button>
                  <button onClick={handlePrevSong} className="text-gray-300 hover:text-white transition-colors">
                    <Icon name="SkipBack" size={20} className="fill-current" />
                  </button>
                  <button 
                    onClick={togglePlayPause}
                    className="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center shadow-lg hover:scale-105 transition-transform"
                  >
                    <Icon name={isPlaying ? "Pause" : "Play"} size={20} className="fill-black" />
                  </button>
                  <button onClick={handleNextSong} className="text-gray-300 hover:text-white transition-colors">
                    <Icon name="SkipForward" size={20} className="fill-current" />
                  </button>
                  <button 
                    onClick={() => setRepeatMode(repeatMode === "off" ? "all" : repeatMode === "all" ? "one" : "off")} 
                    className={`text-xs ${repeatMode !== "off" ? "text-green-500" : "text-gray-400 hover:text-white"}`}
                  >
                    <Icon name="Repeat" size={18} />
                  </button>
                </div>

                {/* Progress Bar Slider */}
                <div className="w-full flex items-center space-x-3 text-xs text-gray-400 font-mono">
                  <span>{formatTime(currentTimeSec)}</span>
                  <input 
                    type="range" 
                    min="0" 
                    max="100" 
                    value={playbackProgress}
                    onChange={handleSeek}
                    className="w-full h-1 bg-dark-border rounded-lg appearance-none cursor-pointer accent-green-500"
                  />
                  <span>{currentSong.duration}</span>
                </div>
              </div>

              {/* Right Volume & Player Expand */}
              <div className="flex items-center justify-end space-x-4 w-1/4">
                <button onClick={() => setIsMuted(!isMuted)} className="text-gray-400 hover:text-white">
                  <Icon name={isMuted || volume === 0 ? "VolumeX" : "Volume2"} size={18} />
                </button>
                <input 
                  type="range" 
                  min="0" 
                  max="100" 
                  value={isMuted ? 0 : volume}
                  onChange={(e) => { setVolume(e.target.value); setIsMuted(false); }}
                  className="w-20 h-1 bg-dark-border rounded-lg appearance-none cursor-pointer accent-green-500 hidden md:block"
                />
                <button onClick={() => setIsExpandedPlayerOpen(true)} className="text-gray-400 hover:text-white">
                  <Icon name="Maximize2" size={18} />
                </button>
              </div>
            </footer>
          )}

          {/* EXPANDED FULL-SCREEN NOW PLAYING MODAL */}
          {isExpandedPlayerOpen && currentSong && (
            <div className="fixed inset-0 z-50 bg-dark-base/95 backdrop-blur-2xl flex flex-col justify-between p-6 md:p-12 animate-fade-in">
              <div className="flex items-center justify-between">
                <button onClick={() => setIsExpandedPlayerOpen(false)} className="p-2 text-gray-400 hover:text-white">
                  <Icon name="ChevronDown" size={28} />
                </button>
                <span className="text-xs font-bold text-gray-400 uppercase tracking-widest">Now Playing</span>
                <button onClick={() => toggleFavourite(currentSong.id)} className="p-2 text-gray-400 hover:text-red-500">
                  <Icon name="Heart" size={24} className={favourites.includes(currentSong.id) ? "fill-red-500 text-red-500" : ""} />
                </button>
              </div>

              <div className="flex flex-col items-center justify-center my-auto space-y-8">
                <div className={`w-64 h-64 md:w-80 md:h-80 rounded-3xl overflow-hidden shadow-2xl border border-white/10 ${isPlaying ? 'vinyl-spin' : ''}`}>
                  <img src={currentSong.coverUrl} alt={currentSong.title} className="w-full h-full object-cover" />
                </div>
                <div className="text-center space-y-1">
                  <h2 className="text-2xl md:text-3xl font-extrabold text-white">{currentSong.title}</h2>
                  <p className="text-gray-400 text-base">{currentSong.artist} — <span className="text-gray-500">{currentSong.album}</span></p>
                </div>
              </div>

              <div className="max-w-xl mx-auto w-full space-y-4">
                <div className="w-full flex items-center space-x-3 text-xs text-gray-400 font-mono">
                  <span>{formatTime(currentTimeSec)}</span>
                  <input 
                    type="range" 
                    min="0" 
                    max="100" 
                    value={playbackProgress}
                    onChange={handleSeek}
                    className="w-full h-1 bg-dark-border rounded-lg appearance-none cursor-pointer accent-green-500"
                  />
                  <span>{currentSong.duration}</span>
                </div>
                <div className="flex items-center justify-center space-x-8">
                  <button onClick={handlePrevSong} className="text-gray-300 hover:text-white">
                    <Icon name="SkipBack" size={28} className="fill-current" />
                  </button>
                  <button 
                    onClick={togglePlayPause}
                    className="w-16 h-16 rounded-full bg-green-500 text-black flex items-center justify-center shadow-2xl hover:scale-105 transition-transform"
                  >
                    <Icon name={isPlaying ? "Pause" : "Play"} size={32} className="fill-black ml-0.5" />
                  </button>
                  <button onClick={handleNextSong} className="text-gray-300 hover:text-white">
                    <Icon name="SkipForward" size={28} className="fill-current" />
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render App
    ReactDOM.createRoot(document.getElementById('root')).render(<LoopApp />);
  </script>
</body>
</html>
